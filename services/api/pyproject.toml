[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "racing-intelligence-api"
version = "0.1.0"
description = "Local FastAPI foundation for Racing Intelligence Lab"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "PyJWT[crypto]==2.10.1",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.10",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "pytest==8.4.1",
  "ruff==0.12.9"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
