name: Racing Intelligence Lab CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            services/api/requirements.lock.txt
            services/api/requirements-ml.lock.txt
      - name: Install pinned backend dependencies
        run: python -m pip install --requirement services/api/requirements.lock.txt --requirement services/api/requirements-ml.lock.txt
      - name: Backend tests
        run: python -m pytest services/api/tests -q
      - name: Ruff
        run: python -m ruff check services/api/app services/api/tests scripts

  postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: racing_intelligence_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexus -d racing_intelligence_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: postgresql+psycopg://nexus:nexus@127.0.0.1:5432/racing_intelligence_dev
      RACING_INTELLIGENCE_DB_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - name: Install pinned database dependencies
        run: python -m pip install --requirement services/api/requirements.lock.txt
      - name: Validate disposable database target
        run: python scripts/validate_database_target.py
      - name: Apply migrations and verify checksums
        run: |
          python -m alembic -c alembic.ini upgrade head
          python scripts/record_migration_checksums.py
          python scripts/verify_migration_checksums.py
          python scripts/verify_ingestion_schema.py
      - name: Exercise producer, replay idempotency, and durable consumer
        run: |
          python scripts/run_postgres_synthetic_ingestion.py --replay-id db-smoke-primary
          python scripts/run_postgres_synthetic_ingestion.py --replay-id db-smoke-primary
          python scripts/run_postgres_synthetic_ingestion.py --replay-id db-smoke-replay
      - name: Exercise downgrade and clean re-upgrade
        run: |
          python -m alembic -c alembic.ini downgrade base
          python -m alembic -c alembic.ini upgrade head
          python scripts/record_migration_checksums.py
          python scripts/verify_migration_checksums.py
          python scripts/verify_ingestion_schema.py

  contracts-security-and-synthetic-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - name: Install pinned validation dependencies
        run: python -m pip install --requirement services/api/requirements.lock.txt
      - name: Validate OpenAPI and TypeScript contracts
        run: python scripts/validate_contracts.py
      - name: Security and secret scan
        run: python scripts/security_audit.py
      - name: Validate operational, backup, budget and egress controls
        run: |
          python scripts/generate_sbom.py
          python scripts/generate_operations_fixture.py
          python scripts/generate_backup_fixture.py
          python scripts/generate_assistant_eval_fixture.py
          python scripts/generate_egress_fixture.py
      - name: Synthetic RIL-061 evidence
        run: python scripts/generate_ril061_evidence.py
      - name: Synthetic replay and specialist manifests
        run: |
          python scripts/generate_betfair_replay_manifest.py
          python scripts/generate_specialist_model_manifest.py
          python scripts/generate_b0_forecast_manifest.py
          python scripts/generate_b1_forecast_manifest.py
          python scripts/run_synthetic_ingestion.py
          python scripts/generate_ablation_fixture.py
          python scripts/generate_assurance_fixture.py
          python scripts/generate_release_gate_fixture.py
      - name: Synthetic B3 evidence
        run: |
          python -m pip install --requirement services/api/requirements-ml.lock.txt
          python scripts/generate_b3_synthetic_evidence.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm run web:check
      - name: Authenticated dashboard regression
        env:
          VITE_AUTH_REQUIRED: 'true'
        run: pnpm run web:test
      - name: Frontend production build
        run: pnpm run web:build

  render-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: services/api/requirements.lock.txt
      - name: Install Blueprint and authentication validation dependencies
        run: python -m pip install --requirement services/api/requirements.lock.txt
      - name: Validate Nexus Render Blueprint
        run: python scripts/validate_render_blueprint.py
      - name: Validate real OIDC authentication and authorisation
        run: python -m pytest services/api/tests/test_oidc_auth.py -q
      - name: Validate provider connectivity is disabled by default
        run: python -m pytest services/api/tests/test_external_provider_integrations.py -q

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser smoke and accessibility tests
        run: pnpm run web:e2e
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ril-061-browser-evidence
          path: |
            docs/evidence/ril-061/research-workbench.png
            test-results/
          if-no-files-found: ignore
