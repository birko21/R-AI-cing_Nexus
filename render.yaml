# Nexus-only staging Blueprint. It deliberately defines no database, worker,
# paid resource, provider activation, or automatic deployment.
services:
  - type: web
    name: nexus-staging-api
    runtime: python
    region: singapore
    plan: free
    rootDir: services/api
    buildCommand: pip install --requirement requirements.lock.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: "off"
    envVars:
      - key: APP_ENV
        value: staging
      - key: API_HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: oidc
      - key: ALLOW_LOCAL_AUTH
        value: "false"
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: OIDC_ALLOWED_SUBJECTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://nexus-staging-frontend.onrender.com
      - key: NEXUS_DIAGNOSTICS_ENABLED
        value: "false"
      - key: NEXUS_PROVIDER_PUNTERS_EDGE_ENABLED
        value: "false"
      - key: NEXUS_PROVIDER_PUNTERS_EDGE_API_KEY
        sync: false
      - key: NEXUS_PROVIDER_FORMFAV_ENABLED
        value: "false"
      - key: NEXUS_PROVIDER_FORMFAV_API_KEY
        sync: false
      - key: NEXUS_PROVIDER_KROK_ODDS_ENABLED
        value: "false"
      - key: NEXUS_PROVIDER_KROK_ODDS_API_KEY
        sync: false
      - key: NEXUS_PROVIDER_BETFAIR_ENABLED
        value: "false"
      - key: NEXUS_PROVIDER_BETFAIR_APP_KEY
        sync: false
      - key: NEXUS_PROVIDER_BETFAIR_SESSION_TOKEN
        sync: false

  - type: web
    name: nexus-staging-frontend
    runtime: static
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @racing-intelligence/web build
    staticPublishPath: apps/web/dist
    autoDeployTrigger: "off"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://nexus-staging-api.onrender.com https://*.auth0.com; frame-src https://*.auth0.com; form-action 'self' https://*.auth0.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nexus-staging-api.onrender.com
      - key: VITE_AUTH_REQUIRED
        value: "true"
      - key: VITE_AUTH0_DOMAIN
        sync: false
      - key: VITE_AUTH0_CLIENT_ID
        sync: false
      - key: VITE_AUTH0_AUDIENCE
        sync: false
      - key: VITE_AUTH0_ALLOWED_SUBJECT
        sync: false
